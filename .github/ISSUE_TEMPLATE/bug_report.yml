name: Bug report
description: Report a defect in the Engram desktop app.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Engram is maintained
        by one person in a few hours a week; a precise report is the fastest
        route to a fix.

        For anything security-related, do not use this form — report it
        privately as described in SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the behaviour you observed.
      placeholder: A clear and concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: Describe what you expected instead.
      placeholder: A clear and concise description of what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps, in order, that trigger the problem.
      placeholder: |
        1. Open Engram
        2. Create a deck named ...
        3. Add a card with ...
        4. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Engram version
      description: Shown under Help → About, or the release tag you downloaded.
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      description: Include the architecture if you know it.
      placeholder: e.g. Windows 11 23H2, macOS 14.5, Ubuntu 24.04 (x86_64)
    validations:
      required: true
  - type: dropdown
    id: new-library
    attributes:
      label: Does it happen on a new library?
      description: >-
        Use File → New library to start from an empty one, then try to
        reproduce. This tells us whether existing data is involved.
      options:
        - "Yes"
        - "No"
        - "Not tried"
    validations:
      required: true
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Acknowledgement
      options:
        - label: >-
            This report contains no secrets, tokens or personal data.
          required: true
        - label: I have searched existing issues for the same problem.
          required: false
