name: Release

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ''
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ''
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - uses: Swatinem/rust-cache@v2
    - name: Tests
      run: cargo test --all --target ${{ matrix.target }}
    - name: Build release
      run: cargo build --release --target ${{ matrix.target }}
    - name: Package
      shell: bash
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        mkdir -p dist
        cp "target/release/engram${{ matrix.ext }}" \
           "dist/engram-${VERSION}-${{ matrix.target }}${{ matrix.ext }}"
    - uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.target }}
        path: dist/*
        if-no-files-found: error
        retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        pattern: release-*
        path: dist
        merge-multiple: true
    - name: Checksums
      run: |
        cd dist
        sha256sum * > checksums-sha256.txt
    - name: Extract release notes from CHANGELOG
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        awk -v section="## [$VERSION]" '
          $0 == section { found = 1; next }
          /^## \[/ && found { exit }
          found { print }
        ' CHANGELOG.md > notes.md || true
        if [ ! -s notes.md ]; then
          echo "Engram ${GITHUB_REF_NAME} — see CHANGELOG.md for the full list of changes." > notes.md
        fi
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" \
          --title "Engram $GITHUB_REF_NAME" \
          --notes-file notes.md \
          --verify-tag \
          dist/*
