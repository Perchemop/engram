name: Release

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ''
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ''
    runs-on: ${{ matrix.os }}
    steps:
    # Actions are pinned to full commit SHAs (guide §20.3, audit finding
    # release-workflow-mutable-actions); the trailing comment records the
    # release the SHA came from. Dependabot keeps them current.
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable
        targets: ${{ matrix.target }}
    - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
    - name: Tests
      run: cargo test --all --locked --target ${{ matrix.target }}
    - name: Build release
      run: cargo build --release --locked --target ${{ matrix.target }}
    - name: Package
      shell: bash
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        mkdir -p dist
        cp "target/${{ matrix.target }}/release/engram${{ matrix.ext }}" \
           "dist/engram-${VERSION}-${{ matrix.target }}${{ matrix.ext }}"
        cp assets/examples/sample.engram.json dist/sample.engram.json
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: release-${{ matrix.target }}
        path: dist/*
        if-no-files-found: error
        retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: release-*
        path: dist
        merge-multiple: true
    - name: Checksums
      run: |
        cd dist
        sha256sum * > checksums-sha256.txt
    - name: Personal-data scan of release artefacts (guide II.29)
      run: bash scripts/scan-personal-data.sh --path dist
    - name: Extract release notes from CHANGELOG
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        awk -v prefix="## [$VERSION]" '
          index($0, prefix) == 1 { found = 1; next }
          /^## \[/ && found { exit }
          found { print }
        ' CHANGELOG.md > notes.md || true
        if [ ! -s notes.md ]; then
          echo "Engram ${GITHUB_REF_NAME} — see CHANGELOG.md for the full list of changes." > notes.md
        fi
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" \
          --title "Engram $GITHUB_REF_NAME" \
          --notes-file notes.md \
          --verify-tag \
          dist/*
