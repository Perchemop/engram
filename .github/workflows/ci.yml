name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

# Least privilege by default (audit finding ci-workflow-token-scope); the
# repo default is already read-only, this pins it against future changes.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    # Actions are pinned to full commit SHAs (guide §20.3); the trailing
    # comment records the release the SHA came from. Dependabot keeps them
    # current (see .github/dependabot.yml).
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable
        components: rustfmt, clippy
    - name: Check formatting
      run: cargo fmt --all -- --check
    - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
    - name: Clippy (no warnings)
      run: cargo clippy --all-targets -- -D warnings
    - name: Tests
      run: cargo test --all --locked
    - name: Build release
      run: cargo build --release --locked
    - name: Upload Cargo.lock (for reproducible clean checkouts)
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: cargo-lock
        path: Cargo.lock
        if-no-files-found: error
        retention-days: 30
    - name: Upload Linux release binary
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: engram-linux
        path: target/release/engram
        if-no-files-found: error
        retention-days: 30

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: target/release/engram.exe
            artifact: engram-windows
          - os: macos-latest
            binary: target/release/engram
            artifact: engram-macos
          - os: ubuntu-24.04-arm
            binary: target/release/engram
            artifact: engram-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable
    - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
    - name: Tests
      run: cargo test --all --locked
    - name: Build release
      run: cargo build --release --locked
    - name: Upload ${{ matrix.artifact }} release binary
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ matrix.artifact }}
        path: ${{ matrix.binary }}
        if-no-files-found: error
        retention-days: 30

  # Supply chain (guide §19.4, §20.3, §20.7): secret scanning, dependency
  # licence classes, and a CycloneDX SBOM artefact.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0
    - name: Secret scanning (gitleaks)
      uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable
    - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
      with:
        # Explicit pin: the action's `latest` resolves to cargo-deny 0.16.4,
        # whose bundled rustsec crate cannot parse the current advisory DB
        # (CVSS 4.0 frontmatter; EmbarkStudios/cargo-deny#804). 0.19.9 has
        # rustsec 0.31+ and the v2 deny.toml schema.
        tool: cargo-deny@0.19.9,cargo-cyclonedx
    - name: Dependency licences and advisories (cargo-deny)
      run: cargo deny check licenses sources advisories
    - name: Software Bill of Materials (CycloneDX)
      run: cargo cyclonedx --format json --override-filename sbom
    - name: Upload SBOM
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sbom-cyclonedx
        path: '*.cdx.json'
        if-no-files-found: warn
        retention-days: 90

  # Static application security testing (guide §20.2, §20.7).
  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        # Diff-informed analysis needs the PR base commit locally: with the
        # default shallow clone CodeQL fails to fetch `main` and produces an
        # invalid alert-range file ("error processing shallow info").
        fetch-depth: 0
    - name: Initialise CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        languages: rust
    - name: Analyse
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  # Packaging declaration check (guide §4): dist-workspace.toml is the source
  # of truth for installers and targets. `dist plan` resolves it and prints
  # every artefact a tag would build, so a broken definition fails here rather
  # than during a release. The release workflow is regenerated by `dist init`,
  # not hand-edited.
  packaging-plan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Install cargo-dist (pinned URL + checksum, audit finding installer-script-injection-risk)
      run: |
        curl --proto '=https' --tlsv1.2 -LsSf \
          https://github.com/axodotdev/cargo-dist/releases/download/v0.33.1/cargo-dist-installer.sh \
          -o /tmp/cargo-dist-installer.sh
        echo "a7b3b0812d624a09a534ba272aa8e04c801e56a83d553327a4a8632bc03abb94  /tmp/cargo-dist-installer.sh" | sha256sum -c -
        sh /tmp/cargo-dist-installer.sh
    - name: Plan the release artefacts
      run: dist plan --output-format=json
