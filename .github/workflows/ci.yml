name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Check formatting
      run: cargo fmt --all -- --check
    - uses: Swatinem/rust-cache@v2
    - name: Clippy (no warnings)
      run: cargo clippy --all-targets -- -D warnings
    - name: Tests
      run: cargo test --all
    - name: Build release
      run: cargo build --release
    - name: Upload Cargo.lock (for reproducible clean checkouts)
      uses: actions/upload-artifact@v4
      with:
        name: cargo-lock
        path: Cargo.lock
        if-no-files-found: error
        retention-days: 30
    - name: Upload Linux release binary
      uses: actions/upload-artifact@v4
      with:
        name: engram-linux
        path: target/release/engram
        if-no-files-found: error
        retention-days: 30

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: target/release/engram.exe
            artifact: engram-windows
          - os: macos-latest
            binary: target/release/engram
            artifact: engram-macos
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Tests
      run: cargo test --all
    - name: Build release
      run: cargo build --release
    - name: Upload ${{ matrix.artifact }} release binary
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: ${{ matrix.binary }}
        if-no-files-found: error
        retention-days: 30
