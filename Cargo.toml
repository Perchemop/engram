[package]
name = "engram"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Engram — free, cross-platform spaced repetition & active recall flashcards."
license = "MIT"
readme = "README.md"
default-run = "engram"

[dependencies]
eframe = "0.37"
egui = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.15"
# MIT OR Apache-2.0. Update check: GitHub Releases API, fail soft offline.
ureq = "3"
semver = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
