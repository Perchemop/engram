# cargo-dist packaging definition (https://axodotdev.github.io/cargo-dist).
#
# The release matrix in .github/workflows/release.yml is hand-maintained today;
# this file is the declaration we are moving to, because it also produces the
# installers (shell, PowerShell) and the checksums GitHub Releases users expect.
#
# `dist plan` runs on every pull request (ci.yml), so a broken packaging
# definition fails the change that breaks it instead of the tag that ships it.
# The release workflow itself is regenerated by `dist init` in CI — see
# ROADMAP.md — rather than hand-written, because dist owns that file.
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.1"
ci = "github"
hosting = "github"
installers = ["shell", "powershell"]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]
# Pull requests plan (validate) only; tags build and publish.
pr-run-mode = "plan"
install-updater = false
