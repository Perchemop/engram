# cargo-deny configuration (guide §19.4, §20.3).
#
# The CI "supply-chain" job runs `cargo deny check licenses sources` so a
# dependency added under a licence Engram cannot ship is caught before merge.
# Licence classification follows guide §19.2: everything allowed here is
# permissive (no copyleft obligation on Engram's own MIT licence) or a weak
# copyleft (MPL-2.0) used without modification.

[graph]
all-features = true

[advisories]
# RustSec gate (audit finding dependency-pinning-advisories-gap). cargo-deny
# v2 schema: known vulnerabilities and yanked crates fail the supply-chain
# job; unmaintained crates surface as advisory notes for the owner to
# triage. Ignore specific advisory IDs here only with a recorded reason.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; transitive via egui/epaint" },
    { id = "RUSTSEC-2026-0370", reason = "zbus_names unmaintained; transitive via arboard (Linux clipboard)" },
    { id = "RUSTSEC-2026-0371", reason = "zvariant unmaintained; transitive via arboard (Linux clipboard)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; transitive via arboard (Linux clipboard)" },
]

[licenses]
# Require a confident match before accepting a detected licence.
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "MIT-0",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "BSL-1.0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "CDLA-Permissive-2.0",
]

[sources]
# Only crates.io. A dependency from an unknown git host or registry is a
# supply-chain risk and must be a deliberate, reviewed decision.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
